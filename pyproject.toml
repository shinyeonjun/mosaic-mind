[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-cognitive-lab"
version = "0.1.0"
description = "Small controlled experiments for recurrent cognitive cores"
requires-python = ">=3.10"
dependencies = ["torch>=2.13,<2.15"]

[project.optional-dependencies]
llm = ["transformers>=4.57"]
notebook = ["jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

